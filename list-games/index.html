<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EuQueSeiTec</title>
<style>
:root {
  --amarelo: #ffcc00;
  --amarelo-escuro: #d4a900;
  --cinza-borda: #e0e0e0;
  --texto-principal: #1a1a1a;
  --branco: #ffffff;
  --sombra-botao: rgba(0,0,0,0.15);
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(to bottom, #ffffff 0%, #f9f9f9 100%);
  color: var(--texto-principal);
  margin: 0;
  padding: 0;
}

/* ===== Cabeçalho ===== */
header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 15px 30px;
  border-bottom: 2px solid var(--cinza-borda);
  background: var(--branco);
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

header img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}

header h1 {
  color: var(--amarelo-escuro);
  font-size: 38px;
  margin: 0;
  font-weight: 700;
}

/* ===== Main ===== */
main {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin: 60px auto;
  max-width: 700px;
  padding: 0 15px;
}

/* ===== Botões ===== */
button {
  background: var(--amarelo);
  border: 2px solid var(--amarelo-escuro);
  border-radius: 12px;
  padding: 18px 30px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  color: var(--texto-principal);
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
  width: 100%;
  max-width: 280px;
  box-shadow: 0 4px 8px var(--sombra-botao);
}
button:hover {
  background: var(--amarelo-escuro);
  color: var(--branco);
  transform: translateY(-3px);
  box-shadow: 0 8px 16px var(--sombra-botao);
}

/* ===== Responsividade ===== */
@media (max-width: 600px) {
  header {
    flex-direction: column;
    text-align: center;
    gap: 10px;
  }
  header img {
    width: 90px;
    height: 90px;
  }
  header h1 {
    font-size: 28px;
  }
}
</style>
</head>
<body>

<header>
  <img src="icone.png" alt="Ícone do EuQueSeiTec">
  <h1>EuQueSeiTec</h1>
</header>

<main>
  <button onclick="window.location.href='lista-ps2.html'">Lista Playstation 2</button>
  <button onclick="window.location.href='lista-ps3.html'">Lista Playstation 3</button>
  <button onclick="window.location.href='lista-xbox360.html'">Lista Xbox 360</button>
  <button onclick="window.location.href='lista-switch.html'">Lista Nintendo Switch</button>
  <button onclick="window.location.href='dadosjogos.html'">Alterar Dados</button>
</main>

</body>
</html>
