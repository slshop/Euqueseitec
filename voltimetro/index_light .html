<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voltímetro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    :root {
      --bg-color: #fffef0;
      --text-color: #1a1a1a;
      --card-bg: linear-gradient(135deg, #fef9e7 0%, #fffef0 100%);
      --card-border: #f0e68c;
      --chart-bg: white;
      --chart-grid: #f0f0f0;
      --chart-ticks: #999;
      --btn-border: #1a1a1a;
      --subtitle-color: #666;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #f0f0f0;
      --card-bg: #1e1e1e;
      --card-border: #333;
      --chart-bg: #1e1e1e;
      --chart-grid: #333;
      --chart-ticks: #666;
      --btn-border: #f0f0f0;
      --subtitle-color: #aaa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      gap: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      margin-bottom: 10px;
      position: relative;
    }
    .logo { height: 60px; width: auto; }
    .header-text { display: flex; flex-direction: column; }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .subtitle { font-size: 0.9rem; color: var(--subtitle-color); font-weight: 600; }

    #btn-theme {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      padding: 8px 12px;
      font-size: 0.7rem;
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--btn-border);
    }

    .control-section {
      display: flex;
      align-items: stretch;
      gap: 20px;
      width: 100%;
    }

    .voltimeter {
      flex: 1;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 10px 30px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between; /* Espaça voltímetro e cronômetro */
      gap: 20px;
    }

    .volt-group, .timer-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .voltage-display, .timer-display {
      font-size: 4.5rem; /* Ajustado para caber ambos */
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .voltage-unit { 
      font-size: 1.5rem; 
      color: var(--subtitle-color); 
      font-weight: 800;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 200px;
    }

    button {
      width: 100%;
      padding: 10px 15px;
      border-radius: 8px;
      border: 2px solid var(--btn-border);
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    button:hover:not(:disabled) { transform: translateX(4px); opacity: 0.8; }
    button:disabled { opacity: 0.3; cursor: not-allowed; border-color: #ccc; }

    #btn-connect    { background: #f0e68c; color: #1a1a1a; }
    #btn-disconnect { background: #1a1a1a; color: #fffef0; }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ccc;
      border: 1px solid var(--btn-border);
    }
    .dot.connected    { background: #f0e68c; }
    .dot.reading      { background: #ffb366; animation: pulse 0.4s infinite alternate; }

    @keyframes pulse { from { opacity: 1; transform: scale(1); } to { opacity: 0.5; transform: scale(1.2); } }

    .debug-info { font-family: monospace; font-size: 0.7rem; color: #999; }

    .chart-section-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--subtitle-color);
      text-transform: uppercase;
      margin-bottom: -10px;
      padding-left: 10px;
    }

    .chart-wrapper {
      background: var(--chart-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      height: 300px;
      position: relative;
      border: 2px solid var(--card-border);
      width: 100%;
    }

    canvas { width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="assets/logo.png" alt="SL SHOP" class="logo">
      <div class="header-text">
        <h1>Voltímetro</h1>
        <p class="subtitle">SISTEMA DE MONITORAMENTO EM TEMPO REAL</p>
      </div>
      <button id="btn-theme">MODO ESCURO</button>
    </header>

    <div class="control-section">
      <div class="voltimeter">
        <div class="volt-group">
          <div class="voltage-display" id="voltage-value">0.00</div>
          <div class="voltage-unit">VOLTS</div>
        </div>
        <div class="timer-group">
          <div class="timer-display" id="timer-value">00:00:00</div>
          <div class="voltage-unit">TEMPO</div>
        </div>
      </div>

      <div class="controls">
        <button id="btn-connect">CONECTAR</button>
        <button id="btn-disconnect" disabled>DESCONECTAR</button>
      </div>
    </div>

    <div class="info-bar">
      <div class="status">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">AGUARDANDO CONEXÃO...</span>
      </div>
      <div id="debug" class="debug-info">Nenhum dado recebido ainda</div>
    </div>

    <div class="chart-section-title">Tempo Real (Último Minuto)</div>
    <div class="chart-wrapper">
      <canvas id="realtimeChart"></canvas>
    </div>

    <div class="chart-section-title">Histórico Completo</div>
    <div class="chart-wrapper">
      <canvas id="historyChart"></canvas>
    </div>
  </div>

<script>
const Y_MIN = 0;
const Y_MAX = 5.5;
const LIMITE_ALERTA = 4.0;
const MAX_PTS_HISTORY = 100000;

let port = null;
let reader = null;
let keepReading = true;
let startTime = null; 
let totalPausedTime = 0;

let rtVoltages = [];
let rtTimestamps = [];
let hiVoltages = [];
let hiTimestamps = [];

const commonOptions = {
  responsive: true,
  maintainAspectRatio: false,
  animation: false,
  plugins: { 
    legend: { display: false },
    tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y.toFixed(2)} V` } },
    annotation: {
      annotations: {
        line1: {
          type: 'line',
          yMin: LIMITE_ALERTA, yMax: LIMITE_ALERTA,
          borderColor: 'rgba(231, 76, 60, 0.8)',
          borderWidth: 2, borderDash: [6, 6],
          label: {
            display: true, content: '4.0V', position: 'end',
            backgroundColor: 'rgba(231, 76, 60, 0.8)', color: '#fff',
            font: { size: 9, weight: 'bold' }
          }
        }
      }
    }
  },
  scales: {
    x: { 
      grid: { display: true, color: '#f0f0f0', drawBorder: false }, 
      ticks: { display: true, color: '#999', maxTicksLimit: 10, font: { size: 10 } } 
    },
    y: { 
      min: Y_MIN, max: Y_MAX, 
      grid: { color: '#eee' }, 
      ticks: { color: '#666', font: { weight: 'bold' } } 
    }
  }
};

const segmentLogic = {
  borderColor: ctx => {
    if (!ctx.p0 || !ctx.p1) return '#999';
    const val = ctx.p1.parsed.y;
    const prev = ctx.p0.parsed.y;
    // Muda para laranja apenas se o aumento for >= 0.3V
    return (val - prev >= 0.3) ? '#ffb366' : '#999';
  },
  backgroundColor: ctx => {
    if (!ctx.p0 || !ctx.p1) return 'rgba(200, 200, 200, 0.05)';
    const val = ctx.p1.parsed.y;
    const prev = ctx.p0.parsed.y;
    // Muda para laranja apenas se o aumento for >= 0.3V
    return (val - prev >= 0.3) ? 'rgba(255, 179, 102, 0.15)' : 'rgba(200, 200, 200, 0.05)';
  }
};

const rtCtx = document.getElementById('realtimeChart').getContext('2d');
const rtChart = new Chart(rtCtx, {
  type: 'line',
  data: { labels: [], datasets: [{ data: [], borderColor: '#999', borderWidth: 3, pointRadius: 0, fill: true, tension: 0.4, segment: segmentLogic }] },
  options: commonOptions
});

const hiCtx = document.getElementById('historyChart').getContext('2d');
const hiChart = new Chart(hiCtx, {
  type: 'line',
  data: { labels: [], datasets: [{ data: [], borderColor: '#999', borderWidth: 2, pointRadius: 0, fill: true, tension: 0.2, segment: segmentLogic }] },
  options: commonOptions
});

const btnTheme = document.getElementById('btn-theme');
btnTheme.onclick = () => {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.body.setAttribute('data-theme', newTheme);
  btnTheme.textContent = isDark ? 'MODO ESCURO' : 'MODO CLARO';
  const gridColor = isDark ? '#f0f0f0' : '#333';
  const tickColor = isDark ? '#999' : '#666';
  [rtChart, hiChart].forEach(c => {
    c.options.scales.x.grid.color = gridColor;
    c.options.scales.y.grid.color = gridColor;
    c.options.scales.x.ticks.color = tickColor;
    c.options.scales.y.ticks.color = tickColor;
    c.update();
  });
};

function updateTimer() {
  if (!startTime) return;
  const elapsedMs = Date.now() - startTime;
  const secondsTotal = Math.floor(elapsedMs / 1000);
  const seconds = secondsTotal % 60;
  const minutes = Math.floor(secondsTotal / 60) % 60;
  const hours = Math.floor(secondsTotal / 3600);
  
  const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  document.getElementById('timer-value').textContent = timeStr;
  return timeStr;
}

function addDataPoint(val) {
  const displayVal = Math.max(0, val).toFixed(2);
  document.getElementById('voltage-value').textContent = displayVal;
  document.getElementById('debug').textContent = `RECEBIDO: ${val.toFixed(3)}V`;

  if (!startTime) startTime = Date.now();
  const timeStr = updateTimer();

  hiVoltages.push(val);
  hiTimestamps.push(timeStr);
  if (hiVoltages.length > MAX_PTS_HISTORY) { hiVoltages.shift(); hiTimestamps.shift(); }
  hiChart.data.labels = hiTimestamps;
  hiChart.data.datasets[0].data = hiVoltages;
  hiChart.update('none');

  rtVoltages.push(val);
  rtTimestamps.push(timeStr);
  const pointsPerMinute = 120; 
  if (rtVoltages.length > pointsPerMinute) { rtVoltages.shift(); rtTimestamps.shift(); }
  rtChart.data.labels = rtTimestamps;
  rtChart.data.datasets[0].data = rtVoltages;
  rtChart.update('none');

  const dot = document.getElementById('status-dot');
  dot.classList.add('reading');
  setTimeout(() => dot.classList.remove('reading'), 100);
}

async function readSerial() {
  const textDecoder = new TextDecoder();
  let buffer = "";
  while (port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += textDecoder.decode(value);
        const lines = buffer.split(/[\r\n]+/);
        buffer = lines.pop();
        for (const line of lines) {
          const cleanLine = line.trim();
          if (cleanLine === "") continue;
          const num = parseFloat(cleanLine);
          if (!isNaN(num) && num >= 0 && num <= 10) addDataPoint(num);
        }
      }
    } catch (error) { console.error(error); } finally { reader.releaseLock(); }
  }
}

document.getElementById('btn-connect').onclick = async () => {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    keepReading = true; 
    startTime = Date.now(); // Inicia o cronômetro imediatamente ao conectar
    
    // Inicia atualização visual do cronômetro
    const timerInterval = setInterval(() => {
      if (!keepReading) { clearInterval(timerInterval); return; }
      updateTimer();
    }, 1000);

    document.getElementById('status-text').textContent = "CONECTADO";
    document.getElementById('status-dot').className = "dot connected";
    document.getElementById('btn-connect').disabled = true;
    document.getElementById('btn-disconnect').disabled = false;
    readSerial();
  } catch (e) { alert("Erro: " + e.message); }
};

document.getElementById('btn-disconnect').onclick = async () => {
  keepReading = false; if (reader) await reader.cancel(); if (port) await port.close();
  document.getElementById('status-text').textContent = "DESCONECTADO";
  document.getElementById('status-dot').className = "dot";
  document.getElementById('btn-connect').disabled = false;
  document.getElementById('btn-disconnect').disabled = true;
};
</script>
</body>
</html>
