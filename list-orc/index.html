<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Orçamentos – EuQueSeiTec (Firebase)</title>
<style>
:root {
  --amarelo: #ffcc00;
  --amarelo-escuro: #d4a900;
  --cinza-borda: #e0e0e0;
  --texto-principal: #1a1a1a;
  --branco: #ffffff;
  --sombra-botao: rgba(0,0,0,0.1);
}
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(to bottom, #ffffff 0%, #f9f9f9 100%);
  color: var(--texto-principal);
  margin: 0;
  padding: 0;
}
header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 15px 30px;
  border-bottom: 2px solid var(--cinza-borda);
  background: var(--branco);
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
header img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
header h1 { color: var(--amarelo-escuro); font-size: 38px; margin: 0; font-weight: 700; }
main { max-width: 1000px; margin: 40px auto; padding: 0 20px; text-align: center; }
h2 { font-size: 26px; color: var(--amarelo-escuro); margin-bottom: 15px; }
.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 25px; }
.tab-button {
  background: var(--amarelo);
  border: 2px solid var(--amarelo-escuro);
  border-radius: 10px;
  padding: 10px 18px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.tab-button.active { background: var(--amarelo-escuro); color: var(--branco); }
.tab-button:hover { filter: brightness(0.9); }
.tab-content { display: none; }
.tab-content.active { display: block; }
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--branco);
  box-shadow: 0 4px 8px var(--sombra-botao);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
}
th, td {
  border-bottom: 1px solid var(--cinza-borda);
  padding: 10px 15px;
  text-align: left;
}
tbody tr:hover { background-color: #fff9d1; transition: 0.2s; }
th { background: var(--amarelo); color: #000; font-weight: 600; }
td { font-size: 15px; }
td[contenteditable="true"] { background-color: #fff8d6; }
.actions { margin-top: 15px; text-align: right; }
button.action-btn {
  background: var(--amarelo);
  border: 2px solid var(--amarelo-escuro);
  border-radius: 8px;
  padding: 8px 15px;
  margin-left: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
button.action-btn:hover { background: var(--amarelo-escuro); color: var(--branco); }
.modal {
  animation: fadeIn 0.12s ease-in-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}
@media (max-width: 700px) {
  th, td { font-size: 14px; padding: 8px; }
  table { display: block; overflow-x: auto; white-space: nowrap; }
}
.notice {
  margin: 8px 0 16px;
  color: #555;
  font-size: 14px;
}
</style>
</head>
<body>

<header>
  <img src="icone.png" alt="Ícone do EuQueSeiTec">
  <h1>EuQueSeiTec</h1>
</header>

<main>
  <h2>Orçamentos – Valores de Assistência Técnica para Consoles e seus Acessórios</h2>
  <div class="tabs" id="tabs"></div>
  <div id="tab-contents"></div>
  <div class="notice">As alterações só serão gravadas no Firebase após confirmar a senha e clicar em "Salvar".</div>
</main>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// ----- CONFIG -----
const firebaseConfig = {
  apiKey: "AIzaSyDHjQAajBOiOHy9Xepkje0RYO85Bizt3_Y",
  authDomain: "euqueseitec.firebaseapp.com",
  databaseURL: "https://euqueseitec-default-rtdb.firebaseio.com",
  projectId: "euqueseitec",
  storageBucket: "euqueseitec.firebasestorage.app",
  messagingSenderId: "817928933993",
  appId: "1:817928933993:web:601017f328968ef232c8f8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// ------------------

// Senha local (mesma UX)
const senha = "11005049";

// Categorias
const categorias = [
  "Xbox 360", "Xbox One", "Series", "Nintendo DS-3DS",
  "Nintendo Switch", "Nintendo Wii", "Nintendo WiiU",
  "Playstation 2", "Playstation Vita", "Playstation 3",
  "Playstation 4", "Playstation 5"
];

// Utils: cria chave segura para path do Firebase (remove chars não permitidos)
function chaveParaPath(cat){
  // substitui / . # $ [ ] por '-' e espaços por '_'
  return cat.replace(/[\/\.\#\$\[\]]/g,"-").replace(/\s+/g,"_");
}

// DOM refs
const tabsDiv = document.getElementById("tabs");
const contentsDiv = document.getElementById("tab-contents");
let dadosAlterados = false;

// Cria abas e conteúdos
categorias.forEach((cat,index)=>{
  const btn = document.createElement("button");
  btn.className = index===0?"tab-button active":"tab-button";
  btn.textContent = cat;
  btn.onclick = ()=>selectTab(index);
  tabsDiv.appendChild(btn);

  const div = document.createElement("div");
  div.className = index===0?"tab-content active":"tab-content";
  div.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Serviço / Defeito</th>
          <th>Valor</th>
          <th>Observações</th>
        </tr>
      </thead>
      <tbody id="tbody-${index}">
        <tr><td colspan="3" style="text-align:center; color:#999;">Clique na aba para carregar os dados</td></tr>
      </tbody>
    </table>
    <div class="actions">
      <button class="action-btn" onclick="addRow(${index})">Adicionar</button>
      <button class="action-btn" onclick="toggleEdit(${index})">Editar</button>
      <button class="action-btn" onclick="deleteRow(${index})">Deletar</button>
      <button class="action-btn" onclick="solicitarSenha(()=>saveToFirebase(${index}))">Salvar</button>
    </div>
  `;
  contentsDiv.appendChild(div);
});

// Seleciona aba e carrega dados
function selectTab(index){
  document.querySelectorAll(".tab-button").forEach((b,i)=>b.classList.toggle("active",i===index));
  document.querySelectorAll(".tab-content").forEach((c,i)=>c.classList.toggle("active",i===index));
  loadTabData(index);
}

// Carrega dados do Firebase para a aba
function loadTabData(index){
  const tbody = document.getElementById(`tbody-${index}`);
  tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999;">Carregando...</td></tr>`;
  const cat = categorias[index];
  const path = `/orcamentos/${chaveParaPath(cat)}`;
  db.ref(path).get().then(snapshot=>{
    tbody.innerHTML = "";
    if(snapshot.exists()){
      const data = snapshot.val();
      // data pode ser array ou objeto; normalizar para array
      const arr = Array.isArray(data) ? data : Object.values(data || {});
      if(arr.length === 0){
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999;">Nenhum serviço cadastrado.</td></tr>`;
        return;
      }
      arr.forEach(item=>{
        const tr = document.createElement("tr");
        const serv = item.servico||"";
        const val = item.valor||"";
        const obs = item.obs||"";
        tr.innerHTML = `<td>${escapeHtml(serv)}</td><td>${escapeHtml(val)}</td><td>${escapeHtml(obs)}</td>`;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999;">Nenhum serviço cadastrado.</td></tr>`;
    }
  }).catch(err=>{
    console.error(err);
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999;">Erro ao carregar dados.</td></tr>`;
  });
}

// Adiciona nova linha editável
function addRow(index){
  const tbody = document.getElementById(`tbody-${index}`);
  // se contém apenas a linha de "Nenhum serviço cadastrado." — substituir
  if(tbody.children.length === 1 && tbody.children[0].innerText.includes("Nenhum serviço cadastrado")){
    tbody.innerHTML = "";
  }
  const tr = document.createElement("tr");
  tr.innerHTML = `<td contenteditable="true">Novo serviço</td>
                  <td contenteditable="true">R$0,00</td>
                  <td contenteditable="true">Observações...</td>`;
  tbody.appendChild(tr);
  dadosAlterados = true;
}

// Alterna modo de edição (ativa/desativa contenteditable)
function toggleEdit(index){
  const tds = document.querySelectorAll(`#tbody-${index} td`);
  if(!tds.length) return alert("Nenhum registro para editar.");
  // não permitir edição da linha de placeholder
  if(tds.length === 1 && tds[0].innerText.includes("Nenhum serviço cadastrado")) return alert("Nada para editar.");
  const currentlyEditable = tds[0].getAttribute("contenteditable")==="true";
  tds.forEach(td=>{
    if(td.innerText.includes("Nenhum serviço cadastrado")) return;
    td.setAttribute("contenteditable", !currentlyEditable);
  });
  alert(currentlyEditable ? "Modo de edição desativado." : "Agora você pode editar os registros.");
  dadosAlterados = true;
}

// Deleta última linha (com confirmação)
function deleteRow(index){
  const tbody = document.getElementById(`tbody-${index}`);
  if(!tbody.lastChild) return alert("Nada para deletar.");
  // se a linha é o placeholder, só limpa
  if(tbody.children.length === 1 && tbody.children[0].innerText.includes("Nenhum serviço cadastrado")){
    alert("Nada para deletar.");
    return;
  }
  if(!confirm("Tem certeza que deseja deletar a última linha?")) return;
  tbody.removeChild(tbody.lastChild);
  if(tbody.children.length === 0){
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999;">Nenhum serviço cadastrado.</td></tr>`;
  }
  dadosAlterados = true;
}

// Salva os dados da aba no Firebase
function saveToFirebase(index){
  const tbody = document.getElementById(`tbody-${index}`);
  const rows = Array.from(tbody.children)
    .filter(tr => !tr.innerText.includes("Nenhum serviço cadastrado"))
    .map(tr=>{
      const tds = tr.children;
      return {
        servico: tds[0] ? tds[0].innerText.trim() : "",
        valor: tds[1] ? tds[1].innerText.trim() : "",
        obs: tds[2] ? tds[2].innerText.trim() : ""
      };
    });
  const cat = categorias[index];
  const path = `/orcamentos/${chaveParaPath(cat)}`;
  // Write: substitui o nó com o array atual (padrão simples)
  db.ref(path).set(rows).then(()=>{
    dadosAlterados = false;
    alert("Dados salvos com sucesso no Firebase.");
    // recarregar para normalizar a visualização
    loadTabData(index);
  }).catch(err=>{
    console.error(err);
    alert("Erro ao salvar no Firebase. Verifique console.");
  });
}

// Modal de senha (reaproveitado)
function solicitarSenha(callback){
  const container = document.createElement("div");
  container.innerHTML = `
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;">
      <div class="modal" style="background:white;padding:20px;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,0.2);text-align:center;min-width:260px;">
        <h3>Digite a senha</h3>
        <input type="password" id="senhaInput" style="padding:8px;width:200px;font-size:16px;text-align:center;">
        <br><br>
        <button id="confirmarSenha" style="padding:6px 14px;font-weight:600;background:#ffcc00;border:2px solid #d4a900;border-radius:6px;cursor:pointer;">Confirmar</button>
        <button id="cancelarSenha" style="padding:6px 14px;margin-left:8px;background:#eee;border:1px solid #ccc;border-radius:6px;cursor:pointer;">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(container);
  const senhaInput = container.querySelector("#senhaInput");
  senhaInput.focus();
  container.querySelector("#confirmarSenha").onclick = ()=>{
    if(senhaInput.value === senha){
      document.body.removeChild(container);
      callback();
    } else {
      alert("Senha incorreta!");
      senhaInput.value = "";
      senhaInput.focus();
    }
  };
  container.querySelector("#cancelarSenha").onclick = ()=>{ document.body.removeChild(container); };
}

// Escapa HTML simples para evitar injeção acidental na visualização
function escapeHtml(text){
  if(!text && text !== 0) return "";
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Antesunload para prevenir perda de dados
window.addEventListener("beforeunload", (e)=>{
  if(dadosAlterados){
    e.preventDefault();
    e.returnValue = "";
  }
});

// Carrega a primeira aba automaticamente
loadTabData(0);

</script>
</body>
</html>
