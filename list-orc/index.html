<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamentos – EuQueSeiTec</title>
<style>
:root {
  --amarelo: #ffcc00;
  --amarelo-escuro: #d4a900;
  --cinza-borda: #e0e0e0;
  --texto-principal: #1a1a1a;
  --branco: #ffffff;
  --sombra-botao: rgba(0,0,0,0.1);
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(to bottom, #ffffff 0%, #f9f9f9 100%);
  color: var(--texto-principal);
  margin: 0;
  padding: 0;
}

/* ===== Cabeçalho ===== */
header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 15px 30px;
  border-bottom: 2px solid var(--cinza-borda);
  background: var(--branco);
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

header img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
}

header h1 {
  color: var(--amarelo-escuro);
  font-size: 38px;
  margin: 0;
  font-weight: 700;
}

/* ===== Conteúdo principal ===== */
main {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 20px;
  text-align: center;
}

h2 {
  font-size: 26px;
  color: var(--amarelo-escuro);
  margin-bottom: 15px;
}

/* ===== Abas ===== */
.tabs {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 25px;
}

.tab-button {
  background: var(--amarelo);
  border: 2px solid var(--amarelo-escuro);
  border-radius: 10px;
  padding: 10px 18px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.tab-button.active {
  background: var(--amarelo-escuro);
  color: var(--branco);
}

.tab-button:hover {
  filter: brightness(0.9);
}

/* ===== Tabela ===== */
.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--branco);
  box-shadow: 0 4px 8px var(--sombra-botao);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
}

th, td {
  border-bottom: 1px solid var(--cinza-borda);
  padding: 10px 15px;
  text-align: left;
}

tbody tr:hover {
  background-color: #fff9d1;
  transition: 0.2s;
}

th {
  background: var(--amarelo);
  color: #000;
  font-weight: 600;
}

td {
  font-size: 15px;
}

td[contenteditable="true"] {
  background-color: #fff8d6;
}

tr:last-child td {
  border-bottom: none;
}

/* ===== Botões de ação ===== */
.actions {
  margin-top: 15px;
  text-align: right;
}

button.action-btn {
  background: var(--amarelo);
  border: 2px solid var(--amarelo-escuro);
  border-radius: 8px;
  padding: 8px 15px;
  margin-left: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

button.action-btn:hover {
  background: var(--amarelo-escuro);
  color: var(--branco);
  filter: brightness(1);
}

@media (max-width: 700px) {
  th, td {
    font-size: 14px;
    padding: 8px;
  }
  table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }
}
</style>
</head>
<body>

<header>
  <img src="icone.png" alt="Ícone do EuQueSeiTec">
  <h1>EuQueSeiTec</h1>
</header>

<main>
  <h2>Orçamentos – Valores de Assistência Técnica para Consoles e seus Acessórios</h2>
  <div class="tabs" id="tabs"></div>
  <div id="tab-contents"></div>
</main>

<script>
let dadosAlterados = false;
const senha = "11005049";

const categorias = [
  "Xbox 360", "Xbox One", "Series", "Nintendo DS/3DS",
  "Nintendo Switch", "Nintendo Wii", "Nintendo WiiU",
  "Playstation 2", "Playstation Vita", "Playstation 3",
  "Playstation 4", "Playstation 5"
];

const dadosXbox360 = [
  ["Limpeza e troca da pasta térmica", "R$ 180,00", "Pasta térmica - 1,93W/mK"],
  ["Desbloqueio LTU", "R$ 300,00", "Peça inclusa"],
  ["Desbloqueio RGH", "R$ 250,00", "Peça inclusa"],
  ["Jogo RGH", "R$ 25,00", "Valor unitário"],
  ["Fonte", "R$ 80,00", "Valor padrão (deixar pré-orçado)"],
  ["Reball", "R$ 350,00", ""],
  ["Troca de leitor óptico", "R$ 250,00", "Somar valor da peça (incluso limpeza e troca da pasta térmica)"],
  ["Troca do botão power", "R$ 120,00", "Somar valor da peça"],
  ["Conserto controle", "R$ 80,00", "Somar valor da peça"],
  ["Pacote de jogos", "", "Consultar canal"],
  ["Plotagem adesivo fibra de carbono", "R$ 80,00", ""],
  ["Jogo RGH - HD 1Tb", "R$ 200,00", "Somar valor do HD"],
  ["Jogo RGH - HD 500Gb", "R$ 150,00", "Somar valor do HD"],
  ["Jogo RGH - HD 250Gb / 320Gb", "R$ 120,00", "Somar valor do HD"]
];

const tabsDiv = document.getElementById("tabs");
const contentsDiv = document.getElementById("tab-contents");

categorias.forEach((cat, index) => {
  const btn = document.createElement("button");
  btn.className = "tab-button" + (index === 0 ? " active" : "");
  btn.textContent = cat;
  btn.onclick = () => selectTab(index);
  tabsDiv.appendChild(btn);

  const div = document.createElement("div");
  div.className = "tab-content" + (index === 0 ? " active" : "");
  div.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Serviço / Defeito</th>
          <th>Valor</th>
          <th>Observações</th>
        </tr>
      </thead>
      <tbody id="tbody-${index}"></tbody>
    </table>
    <div class="actions">
      <button class="action-btn" onclick="solicitarSenha(() => addRow(${index}))">Adicionar</button>
      <button class="action-btn" onclick="editRow(${index})">Editar</button>
      <button class="action-btn" onclick="solicitarSenha(() => deleteRow(${index}))">Deletar</button>
      <button class="action-btn" onclick="solicitarSenha(saveData)">Salvar</button>
    </div>
  `;
  contentsDiv.appendChild(div);
});

// Preenche tabela Xbox 360
const tbody0 = document.getElementById("tbody-0");
dadosXbox360.forEach(linha => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${linha[0]}</td><td>${linha[1]}</td><td>${linha[2]}</td>`;
  tbody0.appendChild(tr);
});

function selectTab(index) {
  document.querySelectorAll(".tab-button").forEach((b, i) => b.classList.toggle("active", i === index));
  document.querySelectorAll(".tab-content").forEach((c, i) => c.classList.toggle("active", i === index));
}

function checkEmptyTable(index) {
  const tbody = document.getElementById(`tbody-${index}`);
  if (tbody.children.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999;">Nenhum serviço cadastrado.</td></tr>`;
  }
}

function addRow(index) {
  const tbody = document.getElementById(`tbody-${index}`);
  const row = document.createElement("tr");
  row.innerHTML = `
    <td contenteditable="true">Novo serviço</td>
    <td contenteditable="true">R$0,00</td>
    <td contenteditable="true">Observações...</td>
  `;
  tbody.appendChild(row);
  dadosAlterados = true;
}

function editRow(index) {
  const tds = document.querySelectorAll(`#tbody-${index} td`);
  if (!tds.length) return alert("Nenhum registro para editar.");
  const editable = tds[0].getAttribute("contenteditable") === "true";
  tds.forEach(td => td.setAttribute("contenteditable", !editable));
  alert(editable ? "Modo de edição desativado." : "Agora você pode editar os registros.");
  dadosAlterados = true;
}

function deleteRow(index) {
  const tbody = document.getElementById(`tbody-${index}`);
  if (tbody.lastChild) {
    tbody.removeChild(tbody.lastChild);
    checkEmptyTable(index);
    dadosAlterados = true;
  }
}

function saveData() {
  const tabelas = [];
  categorias.forEach((_, i) => {
    const tbody = document.getElementById(`tbody-${i}`);
    const linhas = [...tbody.children].map(tr => [...tr.children].map(td => td.innerText));
    tabelas.push(linhas);
  });
  localStorage.setItem("orcamentos", JSON.stringify(tabelas));
  dadosAlterados = false;
  alert("Dados salvos com sucesso!");
}

// ===== Caixa de senha =====
function solicitarSenha(callback) {
  const container = document.createElement("div");
  container.innerHTML = `
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;">
      <div style="background:white;padding:20px;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,0.2);text-align:center;">
        <h3>Digite a senha</h3>
        <input type="password" id="senhaInput" style="padding:8px;width:200px;font-size:16px;text-align:center;">
        <br><br>
        <button id="confirmarSenha" style="padding:6px 14px;font-weight:600;background:#ffcc00;border:2px solid #d4a900;border-radius:6px;cursor:pointer;">Confirmar</button>
        <button id="cancelarSenha" style="padding:6px 14px;margin-left:8px;background:#eee;border:1px solid #ccc;border-radius:6px;cursor:pointer;">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(container);

  const senhaInput = container.querySelector("#senhaInput");
  senhaInput.focus();

  container.querySelector("#confirmarSenha").onclick = () => {
    if (senhaInput.value === senha) {
      document.body.removeChild(container);
      callback();
    } else {
      alert("Senha incorreta!");
      senhaInput.value = "";
      senhaInput.focus();
    }
  };

  container.querySelector("#cancelarSenha").onclick = () => {
    document.body.removeChild(container);
  };
}

// ===== Carregar dados =====
function loadData() {
  const saved = JSON.parse(localStorage.getItem("orcamentos"));
  if (!saved) return;
  saved.forEach((linhas, i) => {
    const tbody = document.getElementById(`tbody-${i}`);
    if (!tbody) return;
    tbody.innerHTML = "";
    linhas.forEach(l => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td>`;
      tbody.appendChild(tr);
    });
    checkEmptyTable(i);
  });
}

window.onload = loadData;

window.onbeforeunload = function(e) {
  if (dadosAlterados) {
    const mensagem = "Você tem alterações não salvas. Deseja realmente sair?";
    e.returnValue = mensagem;
    return mensagem;
  }
};
</script>

</body>
</html>
